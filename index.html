<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.openfoodfacts.org https://static.openfoodfacts.org; connect-src 'self' https://world.openfoodfacts.org https://cdn.jsdelivr.net https://tessdata.projectnaptha.com https://api.allorigins.win https://*.workers.dev; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Freizeitküche</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9542b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{--bg:#f7f3ec;--card:#fff;--ink:#22201b;--muted:#77716a;--line:#e8e2d7;--acc:#d9542b;--acc2:#fbe7dd;--ok:#2f7d4f;--warn:#a85a00;--warnbg:#fff4e1;--r:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.hd{display:flex;gap:12px;align-items:center;max-width:720px;margin:0 auto;padding:12px 16px 6px}
.logo{font-size:30px}
h1{margin:0;font-size:20px;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--muted)}
nav{display:flex;max-width:720px;margin:0 auto;padding:0 8px}
.nav{flex:1;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:8px 4px 10px;border-bottom:3px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.nav span{font-size:18px}
.nav.on{color:var(--acc);border-color:var(--acc)}
.badge{background:var(--acc);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
main{max-width:720px;margin:0 auto;padding:14px 12px 20px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:0 12px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
h3{font-size:15px;margin:14px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px;font-weight:400}
.center{text-align:center;margin:10px 0}
.intro{background:var(--acc2);border-color:#f3cbb8;font-size:15px}
.steps{display:flex;align-items:center;gap:6px;margin:0 0 14px;font-size:13px;color:var(--muted)}
.steps i{flex:1;height:2px;background:var(--line)}
.st{display:flex;gap:6px;align-items:center;white-space:nowrap}
.st b{width:22px;height:22px;border-radius:11px;background:var(--line);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.st.on{color:var(--ink);font-weight:600}
.st.on b{background:var(--acc);color:#fff}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:600;font-size:15px}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.wide{width:100%;padding:13px;margin-top:6px}
.btn.danger-o{color:#b3261e;border-color:#efc4c0}
.btn.danger-f{background:#b3261e;border-color:#b3261e;color:#fff}
.link{border:0;background:none;color:var(--acc);font-weight:600;padding:4px 0}
.link.danger{color:#b3261e}
.big-step{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.big-step input{width:110px;text-align:center;font-size:34px;font-weight:700;border:1px solid var(--line);border-radius:14px;padding:6px;font-family:inherit}
.round{width:48px;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--bg);font-size:24px;font-weight:600;color:var(--ink)}
.round.s{width:34px;height:34px;font-size:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:100px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 6px;font-size:14px;font-weight:600}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.diets{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:560px){.diets{grid-template-columns:1fr 1fr}}
.diet{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;font-size:15px}
.diet.act{background:var(--warnbg);border-color:#f1d2a4}
.mini{display:flex;align-items:center;gap:6px}
.mini button{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1}
.mini b{min-width:20px;text-align:center}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit}
.addrow input.short{flex:0 0 90px}
.rowhead{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.rowhead h2{margin:0;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
.dish{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.dish-main{width:100%;border:0;background:none;text-align:left;padding:14px 12px 12px;display:flex;flex-direction:column;gap:3px;color:var(--ink)}
.dish-main b{font-size:15px;line-height:1.25;padding-right:30px}
.dish-main small{color:var(--muted);font-size:12.5px}
.em{font-size:22px}.em.big{font-size:30px}
.add{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:18px;border:0;background:var(--acc);color:#fff;font-size:20px;font-weight:700}
.add.in{background:var(--ok)}
.warnc{color:var(--warn);font-weight:600}
.plan{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.pl{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px}
.pl-main{flex:1;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;color:var(--ink)}
.pl-main small{display:block;color:var(--muted);font-size:12.5px}
.x{border:0;background:none;color:var(--muted);font-size:16px;padding:8px 12px}
.prog{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.progt{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:6px 0 10px}
.tb{display:flex;gap:8px;flex-wrap:wrap}
.tb .btn{font-size:14px;padding:8px 12px}
.list{padding:6px 0 4px}
.list h3{margin:10px 16px 4px}
.list .addrow{padding:4px 16px 12px}
.it{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.list h3+.it{border-top:0}
.cb{flex:none;width:24px;height:24px;border:2px solid #c9c2b5;border-radius:7px;margin-top:1px;position:relative}
.it.done .cb{background:var(--ok);border-color:var(--ok)}
.it.done .cb:after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.itx{flex:1;min-width:0;display:flex;flex-direction:column}
.itx small{color:var(--muted);font-size:12.5px}
.q{color:var(--acc);font-weight:700;white-space:nowrap}
.it.done b,.it.done .q{text-decoration:line-through;color:#a8a196}
.hide-done .it.done{display:none}
.tag{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--muted);font-weight:600;vertical-align:1px}
.tag.alt{background:var(--warnbg);border-color:#f1d2a4;color:var(--warn)}
.sheet-bg{position:fixed;inset:0;background:rgba(30,25,20,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 20px}
@media(min-width:720px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sh-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.sh-head>div{flex:1}
.sh-head h2{margin:0;font-size:19px}
.pp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-weight:600}
.pp b{font-size:20px;min-width:34px;text-align:center}
.pp input{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;font-weight:400}
.warnbox{background:var(--warnbg);border:1px solid #f1d2a4;border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14.5px}
.warnbox ul{margin:4px 0 6px;padding-left:18px}
.wd{margin-top:6px}
.wl{font-weight:700;color:var(--warn)}
table.ing{width:100%;border-collapse:collapse;font-size:15px}
table.ing td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.ing td.q{width:34%;text-align:right;padding-right:12px}
.sc{font-size:13px}
.wi{font-size:13px}
.how{margin:12px 0;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px}
.how summary{font-weight:600;cursor:pointer}
.how ul{padding-left:18px;margin:6px 0}
.tip{background:#eef6ef;border-radius:12px;padding:10px 12px;font-size:14.5px;margin:10px 0}
.steps-ol{padding-left:20px;margin:0}
.steps-ol li{margin:5px 0}
.sh-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:sticky;bottom:-20px;background:var(--card);padding:10px 0 4px}
.fl{display:block;font-weight:600;font-size:14.5px;margin:10px 0}
.fl input,.fl textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-weight:400}
.photo{display:flex;gap:10px;align-items:center;margin-top:8px}
.drows{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px}
.drow input,.drow select{border:1px solid var(--line);border-radius:9px;padding:7px 6px;font:inherit;font-size:14px;min-width:0;background:#fff}
.drow .dn{flex:1 1 100%;order:-1;font-weight:600}.drow .dq{width:64px}.drow .du{width:70px}.drow select{flex:1;min-width:0}
.ask p{font-size:17px;margin:6px 0 4px}
.copyta{width:100%;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:8px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sep{font-size:12.5px;color:var(--muted)}
.adj{color:#5b6b8a;font-weight:600}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding:2px 4px calc(4px + env(safe-area-inset-bottom));max-width:none}
nav.bottom .nav{flex-direction:column;gap:0;font-size:12px;border-bottom:0;border-top:3px solid transparent;padding:6px 2px 4px}
nav.bottom .nav span{font-size:21px}
nav.bottom .nav.on{border-top-color:var(--acc)}
main{padding-bottom:96px}
footer{padding-bottom:84px}
.steps .st{border:0;background:none;font:inherit;font-size:13px;color:var(--muted);padding:0;cursor:pointer}
.steps .st.on{color:var(--ink);font-weight:600}
.eco{background:#eef6ef;border-color:#cfe5d3}
.tag.eco{background:#eef6ef;border-color:#cfe5d3;color:#2f7d4f}
.avoidnote{font-size:13.5px;background:#fbecec;border:1px solid #f0c9c9;border-radius:10px;padding:7px 10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--warnbg);border:1px solid #f1d2a4;border-radius:20px;padding:3px 10px;font-size:13px}
.btn.big{font-size:18px;padding:18px;margin-bottom:14px}
.cam{position:relative;padding:10px}
.cam video{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover;display:block}
.aim{position:absolute;left:18%;right:18%;top:30%;height:22%;border:3px solid rgba(255,255,255,.85);border-radius:12px;pointer-events:none}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:10px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.res h3{margin:0 0 4px;font-size:18px}
.res.ok{border:2px solid #7cc596;background:#f1faf3}
.res.bad{border:2px solid #e08b85;background:#fdf1f0}
.res.check{border:2px solid #f1c27a;background:var(--warnbg)}
.res.brand{border:2px solid #c9a3e0;background:#f7f0fb}
.rh{display:flex;gap:12px;align-items:center}
.rh img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#fff}
.rl{padding-left:0;list-style:none;margin:10px 0}
.rl li{padding:7px 10px;border-radius:10px;margin-bottom:6px;font-size:14.5px}
.rl li.bad{background:#fbdedb}.rl li.check{background:#fdebc8}.rl li.brand{background:#eedcf7}
.tl{padding-left:18px;margin:0}.tl li{margin:7px 0}
.wseg{margin-bottom:12px}.wseg button{min-width:0;font-size:13px;padding:8px 4px}
.warnbox2{background:#fdf1f0;border-color:#f0c9c9}
.oops{border-top:1px solid var(--line);padding:8px 0}.oops:first-of-type{border-top:0}.oops p{margin:3px 0 0;font-size:14.5px}
.av{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.faq{border-top:1px solid var(--line)}.faq:first-of-type{border-top:0}
.faq button{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;background:none;text-align:left;font-weight:600;padding:10px 0;color:var(--ink);font-size:15px}
.faq p{margin:0 0 10px;font-size:14.5px;color:#4a463f}
.mail{font-weight:700;font-size:16px;word-break:break-all}
a.btn{text-decoration:none;display:inline-block}
details.card summary{cursor:pointer}
.steps{gap:4px}.steps .st{font-size:12px;gap:4px}.steps .st b{width:20px;height:20px}
.fridge{width:100%;max-width:420px;display:block;margin:4px auto 8px}
.ecot{color:#2f7d4f;font-weight:600}
.importbox{background:var(--bg);border-radius:12px;padding:10px 12px;margin:12px 0}
.importbox .addrow{margin-top:6px}
.cookstep{font-size:22px;line-height:1.4;font-weight:600;background:var(--bg);border-radius:14px;padding:18px;margin:12px 0}
.cookings{background:#eef6ef;border-radius:12px;padding:8px 12px;font-size:15px;margin-bottom:10px}
.cookings ul{margin:4px 0 0;padding-left:18px}
.cooknav .btn{flex:1;padding:14px;font-size:17px}
.btn[disabled]{opacity:.4}
#timerBar{position:fixed;top:8px;left:8px;right:8px;z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tchip{pointer-events:auto;background:var(--ink);color:#fff;border-radius:20px;padding:6px 6px 6px 14px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tchip button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:12px;width:24px;height:24px}
.tdone{position:fixed;inset:0;background:rgba(30,25,20,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.tdone>div{background:#fff;border-radius:18px;padding:22px;text-align:center;max-width:320px;font-size:18px}
.dayhead{display:flex;align-items:center;gap:6px;padding:10px 12px 6px}
.dayname{flex:1;font:inherit;font-size:18px;font-weight:700;border:1px solid transparent;border-radius:10px;padding:4px 6px;background:transparent}
.dayname:focus{border-color:var(--line);background:#fff}
.zi{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line)}
.zt{flex:none;min-width:58px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:4px 6px;font-weight:700;font-size:14px}
.zi.done .zt{background:var(--ok);color:#fff;border-color:var(--ok)}
.zi.done .zx{opacity:.5;text-decoration:line-through}
.zx{flex:1;display:flex;flex-direction:column;gap:2px;font-size:15px;min-width:0}
.zx small{color:var(--muted);font-size:12.5px}
.zl{text-align:left;font-size:15px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line)}
.zadd{margin:8px 12px 12px}
.zform{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.zform input,.zform select{border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:14px;min-width:0;background:#fff}
.zform select[id^="zr"],.zform input[id^="zx"]{grid-column:1/3}
.zt-title{width:100%;border:0;border-bottom:2px solid var(--line);font:inherit;font-size:19px;font-weight:700;padding:4px 0 6px;background:transparent;margin-bottom:10px}
.zt-title:focus{outline:none;border-color:var(--acc)}
.ztabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;position:sticky;top:62px;z-index:3;background:var(--bg)}
.ztabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;font:inherit;font-weight:600;font-size:15px}
.ztabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.zcols{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:8px;margin-bottom:10px;scrollbar-width:thin}
.zcol{flex:0 0 100%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.zcol .dayhead{background:var(--acc2);padding:8px 10px}
.zcol .dayname{font-weight:700;font-size:17px}
.zblock{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 12px 3px;border-top:1px solid var(--line);background:#faf8f4}
.zcol .zi{padding:7px 10px;gap:8px;border-top:0}
.zcol .zi + .zi{border-top:1px dashed var(--line)}
.zi.meal{background:#fffaf2}
.zi.meal .zl{font-weight:700;font-size:16px}
.zi.next{box-shadow:inset 4px 0 0 var(--acc)}
.zi.next .zt{border-color:var(--acc);color:var(--acc)}
.zal{color:var(--warn)!important}
.zcol .zt{min-width:52px;font-size:13px}
.zcol .x{font-size:14px;padding:4px}
.zcol .zdel{opacity:.45}
.zcol .zform{grid-template-columns:1fr}
.zcol .zform select[id^="zr"],.zcol .zform input[id^="zx"]{grid-column:auto}
@media(min-width:768px){
  .ztabs{display:none}
  .zcols{width:min(1180px,calc(100vw - 24px));position:relative;left:50%;transform:translateX(-50%);overflow-x:auto;scroll-snap-type:none}
  .zcol{flex:1 1 0;min-width:240px}
}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{background:#fff!important}
  @page big{size:A4 portrait;margin:12mm}
  .ppage.big{page:big}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;font:11pt/1.3 system-ui,Arial,sans-serif}
  .ppage{page-break-after:always;break-after:page}
  .ppage:last-child{page-break-after:auto;break-after:auto}
  .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #000;padding-bottom:4px;margin-bottom:6px}
  .ph h1{font-size:18pt;margin:0}
  .pdate{font-size:9pt}
  .pgrid{width:100%;border-collapse:collapse;table-layout:fixed}
  .pgrid th,.pgrid td{border:1.5px solid #000;vertical-align:top;padding:4px 5px}
  .pgrid thead th{font-size:14pt;background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pgrid th.pb{width:22mm;font-size:10pt;text-align:left}
  .pit{padding:2px 0 3px;border-bottom:.5px dotted #888;break-inside:avoid}
  .pit:last-child{border-bottom:0}
  .pmeal{font-size:13pt}

function extractRecipe(html){
  var recipes = [];
  function scan(o){
    if(!o || typeof o!=="object") return;
    if(Array.isArray(o)){ o.forEach(scan); return; }
    var t = o["@type"];
    if(t==="Recipe" || (Array.isArray(t) && t.indexOf("Recipe")>=0)) recipes.push(o);
    if(o["@graph"]) scan(o["@graph"]);
  }
  var re = /<script[^>]+application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi, m;
  while((m = re.exec(html))){ try{ scan(JSON.parse(m[1].trim())); }catch(e){} }
  if(!recipes.length) return null;
  var r = recipes[0];
  var clean = function(s){ return String(s==null?"":s).replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#0?39;|&apos;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim(); };
  var ings = r.recipeIngredient || r.ingredients || [];
  if(!Array.isArray(ings)) ings = [ings];
  ings = ings.map(clean).filter(Boolean).slice(0,80);
  if(!ings.length) return null;
  var y = Array.isArray(r.recipeYield) ? r.recipeYield[0] : r.recipeYield, ym = String(y==null?"":y).match(/\d+/);
  var steps = [];
  (function col(x){
    if(!x) return;
    if(typeof x==="string"){ var c=clean(x); if(c) steps.push(c); return; }
    if(Array.isArray(x)){ x.forEach(col); return; }
    if(x["@type"]==="HowToSection"){ col(x.itemListElement); return; }
    if(x.text){ var c2=clean(x.text); if(c2) steps.push(c2); }
  })(r.recipeInstructions);
  return {name: clean(r.name).slice(0,120), portions: ym?parseInt(ym[0],10):null, ingredients: ings, steps: steps.slice(0,30)};
}

function bindSwipe(){
  document.querySelectorAll(".swipe").forEach(function(w){
    if(w._b) return; w._b = true;
    var card = w.querySelector(".proj"), x0=0, y0=0, dx=0, drag=false, moved=false;
    function set(px){ card.style.transform = px ? "translateX("+px+"px)" : ""; }
    card.addEventListener("pointerdown", function(e){
      if(e.pointerType==="mouse" && e.button!==0) return;
      x0=e.clientX; y0=e.clientY; dx=0; drag=true; moved=false;
      try{ card.setPointerCapture(e.pointerId); }catch(_){}
      card.style.transition="none";
    });
    card.addEventListener("pointermove", function(e){
      if(!drag) return;
      var ddx=e.clientX-x0, ddy=e.clientY-y0;
      if(!moved){
        if(Math.abs(ddx)<8 && Math.abs(ddy)<8) return;
        if(Math.abs(ddy)>Math.abs(ddx)){ drag=false; set(w._open?-88:0); return; }
        moved=true; closeSwipes(w);
      }
      dx = ddx + (w._open?-88:0);
      if(dx>0) dx=0; if(dx<-104) dx=-104;
      set(dx);
    });
    function end(){ if(!drag) return; drag=false; card.style.transition=""; if(moved){ w._open = dx < -46; set(w._open?-88:0); } }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
    card.addEventListener("click", function(e){
      if(w._open){ e.preventDefault(); e.stopPropagation(); w._open=false; set(0); }
      else if(moved){ e.preventDefault(); e.stopPropagation(); }
    }, true);
  });
}

function lagerUse(l){

    if(it.q==null) return;

    if(!m || !m.ok || m.u!==baseQ(1,it.u).u){ buy[i] = it.q; return; }
    var rest = it.q;
    m.items.filter(function(x){ return mhdState(x.mhd)!=="exp"; }).sort(function(a,b){ return (a.mhd||"9").localeCompare(b.mhd||"9"); }).forEach(function(x){
      var b = baseQ(x.q, x.u); if(!b) return;

    case "addLager": var ln = ($("lgN").value||"").trim().slice(0,40); if(!ln){ toast("Bitte einen Namen eingeben"); break; } var nl = {id:dayId(), name:ln, where:"", upd:0, areas:[]}; G.lager.push(nl); G.inv[nl.id] = []; curLager = nl.id; if(S && !S.lager) S.lager = nl.id; save(); render(); toast("Lager angelegt"); break;
    case "editLager": var el = lagerById(curLager); if(!el) break; showSheet('<div class="sh-head"><h2>Lager bearbeiten</h2><button class="x" data-act="close">✕</button></div><label class="fl">Name<input id="elN" maxlength="40" value="'+esc(el.name)+'"></label><label class="fl">Wo / wer ist zuständig? <span class="muted small">(optional)</span><input id="elW" maxlength="80" placeholder="z. B. Keller Gemeindehaus · Steve" value="'+esc(el.where||"")+'"></label>'+((el.areas||[]).length?'<h3>Bereiche</h3>'+el.areas.map(function(a){ return '<div class="arow"><input class="arn" data-id="'+esc(a.id)+'" maxlength="40" value="'+esc(a.name)+'"><button class="x" data-act="delArea" data-id="'+esc(a.id)+'">🗑</button></div>'; }).join(''):'')+'<div class="sh-foot"><button class="btn primary" data-act="saveLagerMeta">Speichern</button><button class="btn danger-o" data-act="delLager">Lager löschen</button></div>'); break;
    case "saveLagerMeta": var el2 = lagerById(curLager); if(el2){ el2.name = ($("elN").value.trim()||el2.name).slice(0,40); el2.where = $("elW").value.trim().slice(0,80); document.querySelectorAll(".arn").forEach(function(inp){ (el2.areas||[]).forEach(function(a){ if(a.id===inp.getAttribute("data-id") && inp.value.trim()) a.name = inp.value.trim().slice(0,40); }); }); save(); } closeSheet(); render(); break;
    case "delLager": var el3 = lagerById(curLager); if(!el3) break; ask("Lager „"+el3.name+"“ mit allen Vorräten löschen?", "Löschen", function(){ G.lager = G.lager.filter(function(l){ return l.id!==el3.id; }); delete G.inv[el3.id]; G.projects.forEach(function(p){ if(p.lager===el3.id) p.lager = ""; }); curLager = ""; save(); render(); }); break;
    case "addItem": var ni = readItem(); if(!ni) break; addToLager(curLager, ni); keepInvOpen = true; save(); renderKeepScroll(); var f = $("ivN"); if(f) f.focus(); toast("„"+ni.n+"“ eingetragen – nächstes?"); break;
    case "editItem": var ei = (G.inv[curLager]||[]).filter(function(x){ return x.id===t.getAttribute("data-id"); })[0]; if(ei) showSheet('<div class="sh-head"><h2>Vorrat ändern</h2><button class="x" data-act="close">✕</button></div>'+itemForm(ei, lagerById(curLager))); break;
    case "saveItem": var si = readItem(); if(!si) break; var sid = t.getAttribute("data-id"); (G.inv[curLager]||[]).forEach(function(x){ if(x.id===sid){ x.n = si.n; x.q = si.q; x.u = si.u; x.mhd = si.mhd; x.open = si.open; x.c = si.c; x.b = si.b||""; x.date = Date.now(); } }); touchLager(curLager); save(); closeSheet(); render(); break;
    case "delItem": var di = t.getAttribute("data-id"); G.inv[curLager] = (G.inv[curLager]||[]).filter(function(x){ return x.id!==di; }); touchLager(curLager); save(); renderKeepScroll(); break;
    case "lagerExport": exportLager(); break;
    case "takeLager": var tids = t.getAttribute("data-ids").split(","), on = tids.some(function(id){ return S.inUse.indexOf(id)>=0; }); S.inUse = S.inUse.filter(function(id){ return tids.indexOf(id)<0; }); if(!on) S.inUse = S.inUse.concat(tids); save(); renderKeepScroll(); break;
    case "resteSave": resteSave(); break;
    case "resteSkip": ask("Freizeit ohne Reste abschließen?", "Abschließen", function(){ S.closed = true; var nm = S.name; save(); closeProj(); toast("„"+nm+"“ abgeschlossen"); }); break;
    case "scanToLager": scanToLager(); break;
    case "scanItemSave": var sx = readItem(); if(!sx) break; sx.ean = scanState.ean; var tl2 = $("ivL").value; addToLager(tl2, sx); curLager = tl2; save(); closeSheet(); toast("Im Lager „"+lagerById(tl2).name+"“ eingetragen"); break;
    case "zDay": zDay = Number(t.getAttribute("data-di")); document.querySelectorAll(".ztabs button").forEach(function(b, i){ b.classList.toggle("on", i===zDay); }); scrollToDay(zDay); break;
    case "printAll": doPrint(S.days, false); break;
    case "printDay": doPrint([S.days[Number(t.getAttribute("data-di"))]], true); break;
    case "dayDel": var ddi = Number(t.getAttribute("data-di")); ask("Tag „"+S.days[ddi].name+"“ mit allen Einträgen löschen?", "Löschen", function(){ S.days.splice(ddi,1); save(); render(); }); break;
    case "zAdd":
      var zdi = Number(t.getAttribute("data-di")), zk = $("zk"+zdi).value, zr = $("zr"+zdi).value, zx = $("zx"+zdi).value.trim();
      if(zk==="task" && !zx){ toast("Bitte eintragen, was zu tun ist"); break; }
      if(zk==="meal" && !zr && !zx){ toast("Bitte ein Gericht wählen"); break; }
      S.days[zdi].items.push(zItem($("zt"+zdi).value||"", zk, zx.slice(0,80), zk==="meal"?zr:"", $("zw"+zdi).value.trim().slice(0,30)));
      save(); renderKeepScroll(); toast("Eingetragen"); break;
    case "zDel": var zd = S.days[Number(t.getAttribute("data-di"))], zid = t.getAttribute("data-id"); zd.items = zd.items.filter(function(x){ return x.id!==zid; }); save(); renderKeepScroll(); break;
    case "zDone": var zd2 = S.days[Number(t.getAttribute("data-di"))], zid2 = t.getAttribute("data-id"); zd2.items.forEach(function(x){ if(x.id===zid2) x.done = !x.done; }); save(); renderKeepScroll(); break;
    case "linkImport": importLink(($("dLink")||{}).value||""); break;
    case "uncheck": ask("Alle Häkchen entfernen?", "Zurücksetzen", function(){ S.checked = []; (S.extra||[]).forEach(function(x){x.done=false;}); save(); render(); }); break;
  }
});
function readLabel(){ var l = $("plLabel"); if(l && openState && openState.pi!=null && S.plan[openState.pi]){ S.plan[openState.pi].label = l.value.trim(); save(); } }
function renderKeepScroll(){ var y = window.scrollY; render(); window.scrollTo(0,y); }
document.addEventListener("change", function(e){
  if(e.target.id==="persons"){ S.persons = Math.max(1, Math.min(500, parseInt(e.target.value,10)||1)); save(); render(); }
  if(e.target.id==="dPhoto" && e.target.files && e.target.files[0]){ importPhoto(e.target.files[0]); }
  if(e.target.id==="lagerFile" && e.target.files && e.target.files[0]){ importLager(e.target.files[0]); e.target.value = ""; }
    if(e.target.classList && e.target.classList.contains("dayname")){ var di0 = Number(e.target.getAttribute("data-di")); if(S.days[di0]){ S.days[di0].name = e.target.value.trim().slice(0,30) || "Tag"; save(); } }
});
document.addEventListener("keydown", function(e){
  if(e.key==="Enter"){
    if(e.target.id==="custName"){ var b = document.querySelector('[data-act="addCust"]'); if(b) b.click(); }
    if(e.target.id==="exN"||e.target.id==="exQ"){ var b2 = document.querySelector('[data-act="addExtra"]'); if(b2) b2.click(); }
  }
  if(e.key==="Escape") { var bg = $("sheetBg"); if(bg && bg.classList.contains("show")){ closeSheet(); draft = null; render(); } }
});
document.addEventListener("visibilitychange", function(){ if(document.hidden && typeof stopScan==="function"){ stopScan(); } });
if(window.top!==window.self && !/claude\.ai|claudeusercontent|claude\.site/.test(document.referrer||"")){ try{ window.top.location = window.self.location; }catch(e){} }
initStore();
initSample();
handleShare();
})();</script>
